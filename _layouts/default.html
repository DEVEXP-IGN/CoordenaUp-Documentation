<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="{{ site.description }}"
    />
    <title>{{ page.title }} - {{ site.title }}</title>
    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}"
    />
  </head>
  <body>
    <div class="navbar">
      <div class="navbar-container">
        <a href="{{ '/' | relative_url }}" class="logo">{{ site.title }}</a>
      </div>
    </div>

    <div class="hero">
      <div class="hero-container">
        <h1>CoordenaUP</h1>
        <p>Documentação Técnica do Sistema</p>
      </div>
    </div>

    <div class="container">
      <div class="main-content">
        {% include sidebar.html %}

        <main class="content">{{ content }}</main>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-container">
        <p>
          {{ site.title }} • Última atualização: {{ 'now' | date: '%d de %B de %Y'
          }}
        </p>
      </div>
    </footer>
  </body>
</html>
